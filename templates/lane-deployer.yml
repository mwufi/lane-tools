# .github/workflows/lane-deployer.yml — the lane deployer for real GitHub repos.
# The GitHub webhook (control plane /github/webhook) records each push; this job deploys it.
# Pushes that land mid-deploy collapse into one follow-up deploy of the newest HEAD.
name: lane deployer
on:
  push:
    branches-ignore: [main]
    paths: ["convex/**", "package-lock.json"]
concurrency: { group: "lane-${{ github.ref }}", cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/lane/cli/lane.mjs deploy
        env:
          LANE_URL: ${{ vars.LANE_URL }}
          LANE_TOKEN: ${{ secrets.LANE_DEPLOYER_TOKEN }}
          LANE_DEPLOYER: github-actions
