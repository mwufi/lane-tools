name: Deploy lane-control

# Every merge to main deploys the control plane (convex/) so it never lags the code.
# Needs the repo secret LANE_CONTROL_DEPLOY_KEY: a production deploy key for the
# lane-control deployment. Without it, the job skips.
on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-control-plane.yml"
  workflow_dispatch:

concurrency:
  group: deploy-lane-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.LANE_CONTROL_DEPLOY_KEY }}
    steps:
      - name: Check for the deploy key
        id: key
        run: |
          if [ -n "$CONVEX_DEPLOY_KEY" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::LANE_CONTROL_DEPLOY_KEY is not set; skipping deploy"; echo "on=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.on == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.on == 'true'
        with:
          node-version: 20
          cache: npm
      - if: steps.key.outputs.on == 'true'
        run: npm ci
      - name: Check generated pages are current
        if: steps.key.outputs.on == 'true'
        run: npm run build:pages -- --check
      - name: Deploy
        if: steps.key.outputs.on == 'true'
        run: npx convex deploy
